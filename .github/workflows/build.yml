name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar proyecto
        run: |
          NEWEST=""
          BEST=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$BEST" ]; then
              BEST="${t:-0}"
              NEWEST="$f"
            fi
          done
          if [ -n "$NEWEST" ]; then
            echo "Usando $NEWEST"
            unzip -q -o "$NEWEST" -d proyecto
            echo "DIR=proyecto" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi

      - name: Compilar
        run: |
          cd "$DIR"
          gradle assembleDebug --no-daemon

      - name: Copiar APK
        run: cp "$DIR/app/build/outputs/apk/debug/app-debug.apk" Enfoque.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Enfoque
          path: Enfoque.apk

      - name: Publicar APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Enfoque (APK)
          body: Descarga Enfoque.apk e instálalo en tu móvil Android.
          files: Enfoque.apk
          make_latest: true
